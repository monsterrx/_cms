services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: monster-cms-13:local
    container_name: monster_cms_v3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      APP_URL: "http://localhost:${APP_PORT:-9001}"
      ASSET_URL: "http://localhost:${APP_PORT:-9001}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
    ports:
      - "${APP_PORT:-9001}:80"
    volumes:
      - .:/var/www/html/cms
      - vendor:/var/www/html/cms/vendor
      - bootstrap_cache:/var/www/html/cms/bootstrap/cache
      - frontend_build:/var/www/html/cms/public/build
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - rx931

  db:
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    image: monster-cms-mysql:5.7-local
    container_name: monster_cms_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-secret}"
      MYSQL_DATABASE: "${DB_DATABASE:-rxninthr_monster}"
      MYSQL_USER: "${DB_USERNAME:-monster}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
    ports:
      - "${FORWARD_DB_PORT:-3309}:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ../../dumps/rxninthr_monster_20260827.sql:/docker-entrypoint-initdb.d/01-rxninthr-monster.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s
    networks:
      - rx931

  mailhog:
    image: axllent/mailpit:v1.27
    container_name: monster_cms_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - rx931

networks:
  rx931:
    name: monster_cms_rx931

volumes:
  dbdata:
    name: monster_cms_13_dbdata
  vendor:
    name: monster_cms_13_vendor
  bootstrap_cache:
    name: monster_cms_13_bootstrap_cache
  frontend_build:
    name: monster_cms_13_frontend_build
